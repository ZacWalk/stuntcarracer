name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        run: msbuild game.sln /m /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Build Debug Win32
        run: msbuild game.sln /m /t:Build /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Run tests
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\exe\stunt-car-racer-32d.exe `
            -ArgumentList '-test' -WorkingDirectory $PWD -NoNewWindow -Wait -PassThru
          exit $process.ExitCode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.log
          if-no-files-found: warn
